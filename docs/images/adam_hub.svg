<svg viewBox="0 0 1400 330" width="1400" height="330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" role="img" aria-label="ADaM 结构：SDTM 域合并出受试者级 ADSL，ADSL 再派生 ADAE/ADVS/ADTTE，并作为 TFL 的百分比分母">
  <defs>
    <linearGradient id="gSdtm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#5AC8FA"/>
    </linearGradient>
    <linearGradient id="gAdam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5856D6"/><stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="gAdamOut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E8CD8"/><stop offset="1" stop-color="#AF6FE8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E8E93"/>
    </marker>
  </defs>

  <!-- 左侧 SDTM 输入 -->
  <g filter="url(#shadow)">
    <rect x="40"  y="28" width="210" height="56" rx="18" fill="url(#gSdtm)"/>
    <rect x="40"  y="115" width="210" height="56" rx="18" fill="url(#gSdtm)"/>
    <rect x="40"  y="202" width="210" height="56" rx="18" fill="url(#gSdtm)"/>
  </g>
  <g fill="#FFFFFF">
    <text x="145" y="54"  font-size="20" font-weight="800" text-anchor="middle">DM</text>
    <text x="145" y="74"  font-size="13" opacity="0.92" text-anchor="middle">人口学 · 治疗日期</text>
    <text x="145" y="141" font-size="20" font-weight="800" text-anchor="middle">EX</text>
    <text x="145" y="161" font-size="13" opacity="0.92" text-anchor="middle">给药记录</text>
    <text x="145" y="228" font-size="20" font-weight="800" text-anchor="middle">AE</text>
    <text x="145" y="248" font-size="13" opacity="0.92" text-anchor="middle">不良事件</text>
  </g>

  <!-- 中心 hub：ADSL -->
  <g filter="url(#shadow)">
    <rect x="350" y="62" width="340" height="160" rx="24" fill="url(#gAdam)"/>
  </g>
  <g fill="#FFFFFF" text-anchor="middle">
    <text x="520" y="112" font-size="34" font-weight="800">ADSL</text>
    <text x="520" y="144" font-size="17" opacity="0.95">受试者级 · 每人一行</text>
    <text x="520" y="172" font-size="17" opacity="0.95">所有 ADaM 的基础</text>
    <text x="520" y="202" font-size="14" font-family="Menlo, Consolas, monospace" opacity="0.85">TRTSDT · TRTEDT · SAFFL · AGE…</text>
  </g>

  <!-- 右侧 ADaM 产物 -->
  <g filter="url(#shadow)">
    <rect x="790" y="28" width="240" height="56" rx="18" fill="url(#gAdamOut)"/>
    <rect x="790" y="115" width="240" height="56" rx="18" fill="url(#gAdamOut)"/>
    <rect x="790" y="202" width="240" height="56" rx="18" fill="url(#gAdamOut)"/>
  </g>
  <g fill="#FFFFFF">
    <text x="910" y="54"  font-size="20" font-weight="800" text-anchor="middle">ADAE</text>
    <text x="910" y="74"  font-size="13" opacity="0.92" text-anchor="middle">不良事件分析</text>
    <text x="910" y="141" font-size="20" font-weight="800" text-anchor="middle">ADVS</text>
    <text x="910" y="161" font-size="13" opacity="0.92" text-anchor="middle">生命体征</text>
    <text x="910" y="228" font-size="20" font-weight="800" text-anchor="middle">ADTTE</text>
    <text x="910" y="248" font-size="13" opacity="0.92" text-anchor="middle">生存时间</text>
  </g>

  <!-- 箭头：输入 → ADSL -->
  <g stroke="#8E8E93" stroke-width="5">
    <line x1="255" y1="56"  x2="340" y2="56"  marker-end="url(#arrow)"/>
    <line x1="255" y1="143" x2="340" y2="143" marker-end="url(#arrow)"/>
    <line x1="255" y1="230" x2="340" y2="230" marker-end="url(#arrow)"/>
  </g>
  <!-- 箭头：ADSL → 产物 -->
  <g stroke="#8E8E93" stroke-width="5">
    <line x1="695" y1="56"  x2="780" y2="56"  marker-end="url(#arrow)"/>
    <line x1="695" y1="143" x2="780" y2="143" marker-end="url(#arrow)"/>
    <line x1="695" y1="230" x2="780" y2="230" marker-end="url(#arrow)"/>
  </g>

  <!-- 箭头标注 -->
  <g fill="#8E8E93" font-size="15" text-anchor="middle">
    <text x="297" y="42">合并治疗日期</text>
    <text x="297" y="128">合并受试者级变量</text>
  </g>

  <!-- 底部：ADSL 也是 TFL 分母（深色底，保证浅色幻灯背景上的可读性） -->
  <g filter="url(#shadow)">
    <rect x="250" y="272" width="900" height="40" rx="20" fill="url(#gAdam)"/>
  </g>
  <g font-size="17" fill="#FFFFFF" text-anchor="middle">
    <text x="700" y="296">TFL 分母：<tspan font-family="Menlo, Consolas, monospace">build_table(…, alt_counts_df = adsl)</tspan> —— 分子看 ADAE，分母看 ADSL</text>
  </g>
  <path d="M520 222 L520 262" stroke="#AEAEB2" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
