<svg viewBox="0 0 1400 240" width="1400" height="240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" role="img" aria-label="SDTM 映射流程：原始采集数据经三种映射动作变成 SDTM 域">
  <defs>
    <linearGradient id="gRaw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34C759"/><stop offset="1" stop-color="#30B0C7"/>
    </linearGradient>
    <linearGradient id="gNeutral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E6E73"/><stop offset="1" stop-color="#48484A"/>
    </linearGradient>
    <linearGradient id="gSdtm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#5AC8FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E8E93"/>
    </marker>
  </defs>

  <!-- 三张卡片 -->
  <g filter="url(#shadow)">
    <rect x="40"   y="40" width="360" height="130" rx="22" fill="url(#gRaw)"/>
    <rect x="500"  y="40" width="440" height="130" rx="22" fill="url(#gNeutral)"/>
    <rect x="1040" y="40" width="320" height="130" rx="22" fill="url(#gSdtm)"/>
  </g>

  <!-- 箭头 -->
  <g stroke="#8E8E93" stroke-width="5">
    <line x1="412" y1="105" x2="490" y2="105" marker-end="url(#arrow)"/>
    <line x1="952" y1="105" x2="1030" y2="105" marker-end="url(#arrow)"/>
  </g>

  <!-- 卡片 1：原始采集 -->
  <g fill="#FFFFFF" text-anchor="middle">
    <text x="220" y="78" font-size="26" font-weight="800">原始采集（EDC）</text>
    <text x="220" y="105" font-size="16" opacity="0.92">pharmaverseraw · ae_raw</text>
    <rect x="75" y="120" width="290" height="32" rx="16" fill="#000000" opacity="0.16"/>
    <text x="220" y="142" font-size="14" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">IT.AESEV = "Mild Adverse Event"</text>
  </g>

  <!-- 卡片 2：三种映射动作 -->
  <g font-size="16" fill="#FFFFFF">
    <text x="522" y="76" font-size="22" font-weight="800">三种映射动作（sdtm.oak）</text>
    <text x="522" y="108" font-family="Menlo, Consolas, monospace" font-size="15">assign_no_ct</text>
    <text x="665" y="108" opacity="0.92">原样复制</text>
    <text x="522" y="136" font-family="Menlo, Consolas, monospace" font-size="15">assign_ct</text>
    <text x="665" y="136" opacity="0.92">按受控术语表转换</text>
    <text x="522" y="164" font-family="Menlo, Consolas, monospace" font-size="15">hardcode_ct</text>
    <text x="665" y="164" opacity="0.92">写固定常量</text>
  </g>

  <!-- 卡片 3：SDTM 域 -->
  <g fill="#FFFFFF" text-anchor="middle">
    <text x="1200" y="78" font-size="26" font-weight="800">SDTM 域</text>
    <text x="1200" y="105" font-size="16" opacity="0.92">ae.xpt</text>
    <rect x="1065" y="120" width="270" height="32" rx="16" fill="#000000" opacity="0.16"/>
    <text x="1200" y="142" font-size="14" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">AESEV = "MILD"</text>
  </g>

  <!-- 底部示例条（深色底，保证浅色幻灯背景上的可读性） -->
  <rect x="250" y="192" width="900" height="36" rx="18" fill="url(#gNeutral)"/>
  <g font-size="17">
    <text x="330" y="216" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">"Mild Adverse Event"</text>
    <path d="M500 211 L532 211" stroke="#AEAEB2" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="545" y="216" font-family="Menlo, Consolas, monospace" fill="#5AC8FA">assign_ct</text>
    <path d="M645 211 L677 211" stroke="#AEAEB2" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="692" y="216" font-family="Menlo, Consolas, monospace" fill="#FFFFFF">"MILD"</text>
    <text x="792" y="216" fill="#C7C7CC">—— 大写 + 受控术语，这就是 assign_ct 干的事</text>
  </g>
</svg>
